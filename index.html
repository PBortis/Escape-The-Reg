<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape The Reg</title>
<link rel="icon" type="image/png" href="https://ascholarlyskater.com/wp-content/uploads/2015/11/phil-uc.png">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Share+Tech+Mono&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #8b1c1c;
    --maroon-bright: #b52626;
    --maroon-dim: #5a1212;
    --gold: #c9a84c;
    --gold-dim: #7d6530;
    --bg: #0e0b09;
    --panel: #14100d;
    --panel2: #1c1510;
    --border: #2e2218;
    --text: #d4c9b8;
    --text-dim: #7a6e60;
    --green: #3a7d44;
    --green-bright: #5fbf6e;
    --red: #b52626;
    --blue: #2d6a9f;
    --simon-green: #2a7d3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IM Fell English', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 1.5rem 1rem 3rem;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(139,28,28,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(139,28,28,0.03) 0%, transparent 60%);
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url('png/cartographer.png');
    background-repeat: repeat;
    background-size: 800px;
    opacity: 0.45;
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 0;
  }

  body > * { position: relative; z-index: 1; }

  /* ── Header ────────────────────────────────── */
  #header {
    width: 100%;
    max-width: 740px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  #game-title {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    color: var(--maroon);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  #inventory-bar {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  #inventory-label { color: var(--gold-dim); text-transform: uppercase; letter-spacing: 0.08em; }
  #inventory-items { color: var(--gold); display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .inv-item { display: flex; align-items: center; gap: 0.3rem; }
  .inv-item img { width: 28px; height: 28px; object-fit: contain; filter: drop-shadow(0 0 3px rgba(201,168,76,0.5)); }

  /* ── Main passage panel ─────────────────────── */
  #passage-wrap {
    width: 100%;
    max-width: 740px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--panel);
    position: relative;
    overflow: hidden;
  }

  #passage-wrap::before {
    content: '';
    display: block;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--maroon), var(--gold), var(--maroon), transparent);
  }

  #passage-title {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: var(--gold);
    padding: 1.5rem 2rem 1rem;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.05em;
  }

  #passage-content {
    padding: 1.75rem 2rem 2rem;
    line-height: 1.9;
    font-size: 1.02rem;
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #passage-content p { margin-bottom: 1rem; }
  #passage-content em { color: #b0a48e; }
  #passage-content strong { color: var(--text); font-style: normal; }

  /* ── Choices ───────────────────────────────── */
  .choices {
    margin-top: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .choice {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IM Fell English', Georgia, serif;
    font-size: 0.97rem;
    padding: 0.65rem 1.1rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.18s;
    border-radius: 1px;
    position: relative;
  }
  .choice::before {
    content: '›';
    color: var(--maroon);
    margin-right: 0.5rem;
    transition: margin 0.18s;
  }
  .choice:hover {
    background: var(--panel2);
    border-color: var(--maroon-dim);
    color: #f0e8d8;
  }
  .choice:hover::before { margin-right: 0.75rem; }

  .choice:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    border-style: dashed;
  }
  .choice:disabled::before { content: '✕'; color: #555; }

  /* ── Prop boxes ────────────────────────────── */
  .prop-letter {
    background: #120f07;
    border: 1px solid #4a3a1a;
    border-radius: 1px;
    padding: 1.1rem 1.4rem;
    margin: 1.25rem 0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88rem;
    line-height: 1.8;
    color: #c8b47a;
  }

  .prop-terminal {
    background: #020a02;
    border: 1px solid #1a4a1a;
    border-radius: 1px;
    padding: 1.1rem 1.4rem;
    margin: 1.25rem 0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.92rem;
    line-height: 1.8;
    color: #4af04a;
  }
  .prop-terminal .term-label { color: #27a027; font-size: 0.75rem; margin-bottom: 0.5rem; }

  .prop-postit {
    background: #f5f0d0;
    color: #333;
    padding: 1rem 1.25rem;
    margin: 1.25rem 0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88rem;
    line-height: 1.7;
    max-width: 280px;
    box-shadow: 3px 3px 0 #c8c290, 6px 6px 10px rgba(0,0,0,0.4);
    transform: rotate(-1deg);
  }

  .prop-clue {
    background: var(--panel2);
    border: 1px solid #3a2a18;
    padding: 1rem 1.4rem;
    margin: 1.25rem 0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.2rem;
    letter-spacing: 0.35em;
    color: #ddd;
    text-align: center;
    border-radius: 1px;
  }

  .item-found {
    background: #061206;
    border: 1px solid #2d6a2d;
    color: var(--green-bright);
    padding: 0.85rem 1.1rem;
    margin: 1.25rem 0;
    border-radius: 1px;
    font-size: 0.95rem;
  }

  .hint {
    color: var(--text-dim);
    font-style: italic;
    font-size: 0.9rem;
    margin-top: 0.25rem;
    display: none;
  }
  .hint.revealed { display: block; }

  /* ── Puzzle areas ──────────────────────────── */
  .puzzle-area {
    background: #0a0807;
    border: 1px solid #3a2a18;
    padding: 1.4rem;
    margin: 1.5rem 0;
    border-radius: 1px;
    text-align: center;
  }

  .puzzle-label {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    color: var(--gold-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.9rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
  }

  .progress-track {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 0.75rem;
  }

  /* ── Maze buttons ──────────────────────────── */
  .dir-grid {
    display: inline-grid;
    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(3, 40px);
    gap: 4px;
    margin: 0.75rem auto;
  }
  .dir-btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 1px;
  }
  .dir-btn:hover { background: #2a1a0a; border-color: var(--gold-dim); }
  .dir-btn.center { grid-column: 2; grid-row: 2; opacity: 0; pointer-events: none; }

  /* ── Simon buttons ─────────────────────────── */
  .simon-grid {
    display: flex;
    gap: 0.6rem;
    margin: 0.75rem 0;
    flex-wrap: wrap;
  }
  .simon-btn {
    padding: 0.55rem 1.1rem;
    border: none;
    border-radius: 1px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    font-weight: 700;
    transition: filter 0.1s, transform 0.08s;
    text-transform: uppercase;
  }
  .simon-btn:hover { filter: brightness(1.25); transform: translateY(-1px); }
  .simon-btn:active { filter: brightness(0.8); transform: translateY(0); }
  .sbtn-red   { background: #8b1c1c; color: #ffdada; }
  .sbtn-blue  { background: #1c3a8b; color: #daecff; }
  .sbtn-green  { background: #1c6b2a; color: #d0ffd8; }
  .sbtn-yellow { background: #8b7a0a; color: #fffacc; }

  /* ── Text inputs ───────────────────────────── */
  .puzzle-input-row { display: flex; align-items: center; gap: 0.65rem; margin-top: 0.75rem; }
  .p-input {
    background: #050402;
    border: 1px solid #3a2a18;
    color: var(--gold);
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    padding: 0.5rem 0.75rem;
    border-radius: 1px;
    text-align: center;
    text-transform: uppercase;
    width: 120px;
  }
  .p-input:focus { outline: none; border-color: var(--gold-dim); }

  .p-submit {
    background: var(--maroon-dim);
    color: #f0d8d8;
    border: 1px solid var(--maroon);
    padding: 0.5rem 1.1rem;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 1px;
    transition: background 0.15s;
  }
  .p-submit:hover { background: var(--maroon); }

  .msg-ok  { color: var(--green-bright); font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; margin-top: 0.5rem; }
  .msg-err { color: #e05050; font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; margin-top: 0.5rem; }

  /* ── Venn diagram ──────────────────────────── */
  .venn { display: flex; justify-content: center; gap: 1.5rem; margin: 1.5rem 0; align-items: center; }
  .venn-circle {
    width: 90px; height: 90px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
  }
  .vc-brain { background: #0d1826; border: 2px solid #2d6a9f; }
  .vc-bird  { background: #1a0808; border: 2px solid var(--maroon); }

  /* ── Win screen ────────────────────────────── */
  #win-wrap { text-align: center; padding: 1rem 0 2rem; }
  #win-wrap h2 {
    font-family: 'Cinzel', serif;
    font-size: 2rem;
    color: var(--gold);
    margin: 1.5rem 0 1rem;
    letter-spacing: 0.08em;
  }
  #win-wrap p { margin-bottom: 1rem; line-height: 2; }

  /* ── Hint button ────────────────────────────── */
  #hint-btn {
    display: none;
    margin: 0.75rem auto 0;
    background: transparent;
    border: 1px dashed var(--gold-dim);
    color: var(--gold-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    padding: 0.4rem 1.2rem;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.18s;
  }
  #hint-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.06); }
  #hint-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    border-style: dotted;
  }

  /* ── Status bar ─────────────────────────────── */
  #status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0c0906;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    padding: 0.5rem 1rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
    z-index: 100;
  }
  #status-bar .stat-label { color: var(--gold-dim); text-transform: uppercase; letter-spacing: 0.08em; }
  #status-bar .stat-val { color: var(--text); margin-left: 0.35rem; }
  #status-bar .stat-val.danger { color: var(--red); }

  /* ── Location image ──────────────────────────── */
  #location-img-wrap {
    width: 100%;
    max-width: 740px;
    margin: 0.75rem 0 1.25rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    line-height: 0;
    position: relative;
  }
  #location-img-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.82) 100%),
      linear-gradient(to bottom, rgba(14,11,9,0.5) 0%, transparent 25%, transparent 75%, rgba(14,11,9,0.75) 100%);
    pointer-events: none;
  }
  #location-img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    object-position: center 40%;
    display: block;
    filter: brightness(0.55) contrast(1.15) saturate(0.3) sepia(0.45);
    transition: opacity 0.5s ease;
  }

  /* ── Scrollbar ─────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--maroon-dim); border-radius: 3px; }

  /* ── Mistake Deltas Modal ──────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.3s ease;
  }

  .modal-content {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2rem;
    max-width: 600px;
    max-height: 70vh;
    overflow-y: auto;
    position: relative;
  }

  .modal-content h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    color: var(--gold);
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.75rem;
  }

  .mistake-entry {
    margin-bottom: 1.5rem;
    padding: 1rem;
    background: #0a0807;
    border-left: 2px solid var(--maroon);
    border-radius: 1px;
  }

  .mistake-puzzle {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }

  .mistake-delta {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--text);
  }

  .delta-attempt {
    color: #e05050;
    margin-bottom: 0.3rem;
  }

  .delta-correct {
    color: var(--green-bright);
  }

  .modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1.5rem;
    cursor: pointer;
    transition: color 0.2s;
  }

  .modal-close:hover {
    color: var(--text);
  }

  .empty-state {
    color: var(--text-dim);
    text-align: center;
    padding: 2rem 1rem;
    font-style: italic;
  }
</style>
</head>
<body>

<div id="header">
  <div id="game-title">Escape the Reg</div>
  <div id="inventory-bar">
    <span id="inventory-label">Inventory:</span>
    <span id="inventory-items">empty</span>
  </div>
</div>

<div id="location-img-wrap">
  <img id="location-img" src="https://www.lib.uchicago.edu/media/images/1stfloorrr.width-800.jpg" alt="Regenstein Library" />
</div>

<div id="passage-wrap">
  <div id="passage-title"></div>
  <div id="passage-content"></div>
</div>

<button id="hint-btn" onclick="revealHint()">💡 Reveal Hint</button>

<div id="status-bar">
  <span><span class="stat-label">Time:</span><span class="stat-val" id="stat-time">00:00</span></span>
  <span><span class="stat-label">Mistakes:</span><span class="stat-val" id="stat-mistakes">0</span></span>
  <span style="display:flex; align-items:center; gap:0.5rem;">
    <span><span class="stat-label">Hints Used:</span><span class="stat-val" id="stat-hints">0</span></span>
    <button id="mistakes-btn" style="background:transparent; border:1px solid #444; color:#888; padding:0.2rem 0.6rem; font-size:0.7rem; cursor:pointer; border-radius:1px; font-family:'Share Tech Mono',monospace;" onclick="showMistakeDeltas()" title="View mistake history">DEVELOPER</button>
  </span>
</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
const G = {
  inv: new Set(),
  mazeStep: 0,   // 0–4; 4 = complete
  simonStep: 0,  // 0–4; 4 = complete
  chestDone: false,
  caesarDone: false,
  hasID: false,
  mistakes: 0,
  hints: 0,
  lastHintTime: 0,  // Timestamp of last hint reveal
  hintCooldown: 180000,  // 3 minutes in milliseconds
  hintCooldownInterval: null,  // Interval for cooldown timer
  startTime: null,
  timerInterval: null,
  mistakeLog: [],  // Track detailed mistakes: {puzzle, attempt, correct}
};

// ─── Helpers ────────────────────────────────────────────────────────────────
const has = item => G.inv.has(item);

const ITEM_IMAGES = {
  'MAROON KEY':  'png/MaroonKey.png',
  'MIND KEY':    'png/MindKey.png',
  'PHOENIX KEY': 'png/PhoenixKey.png',
  "PHIL'S ID":   'png/PhilID.png',
};

function give(item) {
  G.inv.add(item);
  const el = document.getElementById('inventory-items');
  el.innerHTML = [...G.inv].map(i => {
    const img = ITEM_IMAGES[i] ? `<img src="${ITEM_IMAGES[i]}" alt="${i}">` : '';
    return `<span class="inv-item">${img}<span>${i}</span></span>`;
  }).join('<span style="color:var(--gold-dim)"> · </span>');
}

function formatTime() {
  if (!G.startTime) return '00:00';
  const elapsed = Math.floor((Date.now() - G.startTime) / 1000);
  const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
  const s = (elapsed % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function updateStats() {
  const t = document.getElementById('stat-time');
  const m = document.getElementById('stat-mistakes');
  const h = document.getElementById('stat-hints');
  if (t) t.textContent = formatTime();
  if (m) m.textContent = G.mistakes;
  if (h) h.textContent = G.hints;
}

function updateHintButtonCooldown() {
  const btn = document.getElementById('hint-btn');
  if (!btn) return;
  
  const now = Date.now();
  const timeSinceLastHint = now - G.lastHintTime;
  const remaining = G.hintCooldown - timeSinceLastHint;
  
  if (remaining <= 0) {
    // Cooldown expired
    if (G.hintCooldownInterval) {
      clearInterval(G.hintCooldownInterval);
      G.hintCooldownInterval = null;
    }
    btn.disabled = false;
    btn.textContent = '💡 Reveal Hint';
  } else {
    // Still cooling down
    const remainingSeconds = Math.ceil(remaining / 1000);
    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;
    const timeStr = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;
    btn.textContent = `💡 Hint: ${timeStr}`;
  }
}

function revealHint() {
  const now = Date.now();
  const timeSinceLastHint = now - G.lastHintTime;
  
  // Check if cooldown is still active
  if (G.lastHintTime > 0 && timeSinceLastHint < G.hintCooldown) {
    // Cooldown is active, disable button and show timer
    const btn = document.getElementById('hint-btn');
    if (btn && !btn.disabled) {
      btn.disabled = true;
      // Start cooldown timer
      if (G.hintCooldownInterval) clearInterval(G.hintCooldownInterval);
      G.hintCooldownInterval = setInterval(updateHintButtonCooldown, 100);
      updateHintButtonCooldown();
    }
    return;
  }
  
  const hints = document.querySelectorAll('#passage-content .hint');
  let anyHidden = false;
  hints.forEach(h => { if (!h.classList.contains('revealed')) anyHidden = true; });
  if (!anyHidden) return;
  
  G.hints++;
  G.lastHintTime = now;
  hints.forEach(h => h.classList.add('revealed'));
  updateStats();
  
  // Disable button and start cooldown timer
  const btn = document.getElementById('hint-btn');
  if (btn) {
    btn.disabled = true;
    if (G.hintCooldownInterval) clearInterval(G.hintCooldownInterval);
    G.hintCooldownInterval = setInterval(updateHintButtonCooldown, 100);
    updateHintButtonCooldown();
  }
}

function showMistakeDeltas() {
  if (G.mistakeLog.length === 0) {
    alert('No mistakes yet! You\'re doing great!');
    return;
  }

  // Calculate statistics
  const totalAttempts = G.mistakeLog.length;
  const puzzleStats = {};
  
  // Group attempts by puzzle and calculate average time delta
  G.mistakeLog.forEach((entry, idx) => {
    if (!puzzleStats[entry.puzzle]) {
      puzzleStats[entry.puzzle] = { count: 0, timeDifferences: [] };
    }
    puzzleStats[entry.puzzle].count++;
    
    // Calculate time difference from previous attempt of same puzzle
    const prevEntry = G.mistakeLog.slice(0, idx).reverse().find(e => e.puzzle === entry.puzzle);
    if (prevEntry) {
      const timeDelta = (entry.timestamp - prevEntry.timestamp) / 1000;
      puzzleStats[entry.puzzle].timeDifferences.push(timeDelta);
    }
  });

  // Calculate overall average time delta
  let allTimeDifferences = [];
  Object.values(puzzleStats).forEach(stat => {
    allTimeDifferences = allTimeDifferences.concat(stat.timeDifferences);
  });
  const avgTimeDelta = allTimeDifferences.length > 0 
    ? allTimeDifferences.reduce((a, b) => a + b, 0) / allTimeDifferences.length 
    : 0;
  const totalTimeDelta = allTimeDifferences.reduce((a, b) => a + b, 0);

  function formatSeconds(secs) {
    const minutes = Math.floor(secs / 60);
    const seconds = Math.floor(secs % 60);
    return minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;
  }

  let html = '<div class="modal-content">';
  html += '<button class="modal-close" onclick="closeMistakeModal()">✕</button>';
  html += '<h2>Mistake Deltas</h2>';
  
  // Add summary statistics
  html += '<div style="background: #0a0807; border: 1px solid #3a2a18; border-radius: 1px; padding: 1rem 1.4rem; margin-bottom: 1.5rem;">';
  html += '<div style="font-family: \'Cinzel\', serif; font-size: 0.85rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;">Summary Statistics</div>';
  html += `<div style="font-family: \'Share Tech Mono\', monospace; font-size: 0.8rem; color: var(--text); line-height: 1.8;">`;
  html += `<div>Total Time Between Attempts: <strong>${formatSeconds(totalTimeDelta)}</strong></div>`;
  html += `<div>Avg Time Between Attempts: <strong>${formatSeconds(avgTimeDelta)}</strong></div>`;
  html += `</div></div>`;

  let prevTimestamp = null;
  let prevPuzzle = null;
  G.mistakeLog.forEach((entry, idx) => {
    html += '<div class="mistake-entry">';
    html += `<div class="mistake-puzzle">${entry.puzzle}</div>`;
    html += '<div class="mistake-delta">';
    html += `<div class="delta-attempt">❌ Attempt: <strong>${escapeHtml(entry.attempt)}</strong></div>`;

    // Show time since last failed attempt only if same puzzle
    if (prevTimestamp !== null && prevPuzzle === entry.puzzle) {
      const timeDelta = (entry.timestamp - prevTimestamp) / 1000; // Convert to seconds
      html += `<div style="margin-top:0.5rem; font-size:0.8rem; color:#aaa;">⏱ Time to next attempt: <strong style="color:#888">${formatSeconds(timeDelta)}</strong></div>`;
    }

    prevTimestamp = entry.timestamp;
    prevPuzzle = entry.puzzle;
    html += '</div></div>';
  });

  html += '</div>';

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'mistake-modal-overlay';
  overlay.innerHTML = html;
  overlay.onclick = (e) => {
    if (e.target === overlay) closeMistakeModal();
  };

  document.body.appendChild(overlay);
}

function closeMistakeModal() {
  const modal = document.getElementById('mistake-modal-overlay');
  if (modal) modal.remove();
}

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return text.replace(/[&<>"']/g, m => map[m]);
}

function go(passage) {
  const p = PASSAGES[passage];
  if (!p) return;
  // Swap location image (only animate if the image actually changes)
  const img = document.getElementById('location-img');
  if (img && PASSAGE_IMAGES[passage]) {
    const newSrc = PASSAGE_IMAGES[passage];
    if (img.src !== newSrc) {
      img.style.opacity = '0';
      setTimeout(() => { img.src = newSrc; img.style.opacity = '1'; }, 200);
    }
  }
  // Start timer on first real navigation
  if (!G.startTime && passage !== 'Start') {
    G.startTime = Date.now();
    G.lastHintTime = G.startTime;
    if (G.hintCooldownInterval) clearInterval(G.hintCooldownInterval);
    G.hintCooldownInterval = setInterval(updateHintButtonCooldown, 100);
    G.timerInterval = setInterval(() => {
      const el = document.getElementById('stat-time');
      if (el) el.textContent = formatTime();
    }, 1000);
  }
  // Stop timer when player reaches the win screen
  if (passage === 'Escape' && G.timerInterval) {
    clearInterval(G.timerInterval);
    G.timerInterval = null;
  }
  document.getElementById('passage-title').textContent = p.title;
  // Trigger animation by replacing element
  const old = document.getElementById('passage-content');
  const fresh = document.createElement('div');
  fresh.id = 'passage-content';
  fresh.innerHTML = p.render();
  old.replaceWith(fresh);
  p.boot && p.boot();
  // Show/hide hint button
  const hintEls = fresh.querySelectorAll('.hint');
  const hintBtn = document.getElementById('hint-btn');
  if (hintBtn) hintBtn.style.display = hintEls.length > 0 ? 'block' : 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Render a navigation button (locked or clickable)
function btn(label, target, unlocked = true) {
  if (!unlocked) {
    return `<button class="choice" disabled>${label}</button>`;
  }
  return `<button class="choice" onclick="go('${target}')">${label}</button>`;
}

// ─── Puzzle Logic ────────────────────────────────────────────────────────────

const MAZE_SEQ = ['N','E','S','S'];
function mazeMove(dir) {
  const expected = MAZE_SEQ[G.mazeStep];
  const msg = document.getElementById('maze-msg');
  const prog = document.getElementById('maze-prog');
  if (dir === expected) {
    G.mazeStep++;
    if (G.mazeStep >= 4) {
      go('BLevel');
    } else {
      if (prog) prog.textContent = 'Path so far: ' + MAZE_SEQ.slice(0, G.mazeStep).join(' → ');
      if (msg) { msg.className = 'msg-ok'; msg.textContent = '✓ A gap in the shelves — keep going…'; }
    }
  } else {
    const attemptedPath = MAZE_SEQ.slice(0, G.mazeStep).concat(dir).join(' → ');
    G.mistakeLog.push({
      puzzle: 'Maze Puzzle',
      attempt: attemptedPath,
      correct: MAZE_SEQ.join(' → '),
      timestamp: Date.now()
    });
    G.mazeStep = 0;
    G.mistakes++; updateStats();
    if (prog) prog.textContent = 'Path so far: (start)';
    if (msg) { msg.className = 'msg-err'; msg.textContent = '✗ A dead end. The stacks close in and you find yourself back at the beginning.'; }
  }
}

const SIMON_SEQ = ['RED','BLUE','BLUE','GREEN'];
function simonPress(color) {
  const expected = SIMON_SEQ[G.simonStep];
  const msg = document.getElementById('simon-msg');
  const prog = document.getElementById('simon-prog');
  if (color === expected) {
    G.simonStep++;
    if (G.simonStep >= 4) {
      go('Floor3');
    } else {
      if (prog) prog.textContent = `Sequence: ${G.simonStep}/4 correct`;
      if (msg) { msg.className = 'msg-ok'; msg.textContent = '✓ The machine chimes softly…'; }
    }
  } else {
    const attemptedSeq = SIMON_SEQ.slice(0, G.simonStep).concat(color).join(' → ');
    G.mistakeLog.push({
      puzzle: 'Simon Says Machine',
      attempt: attemptedSeq,
      correct: SIMON_SEQ.join(' → '),
      timestamp: Date.now()
    });
    G.simonStep = 0;
    G.mistakes++; updateStats();
    if (prog) prog.textContent = 'Sequence: 0/4 correct';
    if (msg) { msg.className = 'msg-err'; msg.textContent = '✗ BZZT! The machine buzzes angrily and resets.'; }
  }
}

function checkChest() {
  const val = (document.getElementById('chest-in').value || '').trim();
  const msg = document.getElementById('chest-msg');
  if (val === '1890') {
    give('MAROON KEY');
    G.chestDone = true;
    go('Floor5');
  } else {
    G.mistakeLog.push({
      puzzle: 'Chest Lock Puzzle',
      attempt: val || '(empty)',
      correct: '1890',
      timestamp: Date.now()
    });
    G.mistakes++; updateStats();
    msg.className = 'msg-err';
    msg.textContent = '✗ The lock does not budge.';
  }
}

function checkCaesar() {
  const val = (document.getElementById('caesar-in').value || '').trim().toUpperCase();
  const msg = document.getElementById('caesar-msg');
  if (val === 'UOC') {
    G.caesarDone = true;
    go('Mansueto');
  } else {
    G.mistakeLog.push({
      puzzle: 'Caesar Cipher',
      attempt: val || '(empty)',
      correct: 'UOC',
      timestamp: Date.now()
    });
    G.mistakes++; updateStats();
    msg.className = 'msg-err';
    msg.textContent = '✗ Nothing happens. The cursor blinks indifferently.';
  }
}

function resetGame() {
  G.inv.clear();
  G.mazeStep = 0;
  G.simonStep = 0;
  G.chestDone = false;
  G.caesarDone = false;
  G.hasID = false;
  G.mistakes = 0;
  G.hints = 0;
  G.lastHintTime = 0;
  G.mistakeLog = [];
  G.startTime = null;
  if (G.timerInterval) { clearInterval(G.timerInterval); G.timerInterval = null; }
  if (G.hintCooldownInterval) { clearInterval(G.hintCooldownInterval); G.hintCooldownInterval = null; }
  document.getElementById('inventory-items').textContent = 'empty';
  updateStats();
  go('Start');
}

// ─── Boot ────────────────────────────────────────────────────────────────────
go('Start');
</script>
